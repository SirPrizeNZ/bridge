<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
  --bg:#000;
  --white:#f7f7f5;
  --muted:#8e8e8a;
  --faint:#343432;
  --line:#242422;
  --green:#49ff6a;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;color:var(--white)}
body{font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hide{display:none!important}

.shell{
  position:absolute;
  inset:4px;
  width:auto;
  height:auto;
  min-height:0;
  overflow:hidden;
  background:#000;
  border-radius:0 0 18px 18px;
  box-shadow:0 0 0 1px rgba(255,255,255,.065),0 8px 26px rgba(0,0,0,.34);
  isolation:isolate;
}

.gear{
  position:absolute;top:16px;right:16px;z-index:20;
  width:32px;height:32px;padding:0;border:0;border-radius:10px;
  display:grid;place-items:center;background:transparent;color:#a9a9a6;cursor:pointer;
  transition:background .14s ease,color .14s ease,transform .14s ease;
}
.gear:hover{background:#0e0e0e;color:#fff}
.gear:active{transform:scale(.95)}
.gear svg{width:17px;height:17px}

.brand{
  position:absolute;z-index:2;left:29px;right:29px;top:84px;height:45px;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
}
.brand img{display:block;width:100%;max-width:302px;height:auto;object-fit:contain}

.setup{
  position:absolute;left:28px;right:28px;top:157px;bottom:36px;
  display:flex;flex-direction:column;align-items:stretch;text-align:center;
  animation:fadeIn .2s ease both;
}
.step-label{
  margin:0;color:#a2a2a0;font-size:8px;line-height:11px;font-weight:650;
  letter-spacing:.20em;text-transform:uppercase;
}
.step-title{
  margin:5px 0 0;color:#f1f1ef;font-size:13px;line-height:18px;font-weight:520;
  letter-spacing:-.015em;
}
.prompt-box{
  width:100%;height:42px;margin-top:12px;padding:0 10px 0 13px;
  border:1px solid #3b3b39;border-radius:10px;background:#141414;
  display:flex;align-items:center;gap:10px;cursor:pointer;color:#8c8c89;
  text-align:left;transition:border-color .14s ease,background .14s ease;
}
.prompt-box:hover{border-color:#555551;background:#181818}
.prompt-box:active{transform:scale(.995)}
.prompt-text{
  min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:9.5px;line-height:14px;
}
.copy-icon{width:16px;height:16px;flex:none;color:#dededb}
.copy-icon svg{width:16px;height:16px;display:block}
.divider{height:1px;background:#222220;margin:19px 0 17px}
.step-two{
  max-height:0;opacity:0;overflow:hidden;transform:translateY(-5px);pointer-events:none;
  transition:max-height .28s cubic-bezier(.2,.8,.2,1),opacity .18s ease,transform .28s cubic-bezier(.2,.8,.2,1);
}
.step-two.revealed{max-height:145px;opacity:1;transform:none;pointer-events:auto}

.otp{display:flex;justify-content:center;gap:6px;margin-top:12px}
.otp input{
  width:43px;height:44px;min-width:0;padding:0;
  border:1px solid #3b3b39;border-radius:10px;background:#141414;color:#fff;
  outline:none;text-align:center;caret-color:transparent;
  font:700 16px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  transition:border-color .14s ease,background .14s ease,box-shadow .14s ease;
}
.otp input::placeholder{color:#494946}
.otp input:focus{border-color:#70706b;background:#191919;box-shadow:0 0 0 1px rgba(255,255,255,.045)}
.otp input.filled{border-color:#575753;background:#181818}
.otp input[disabled]{opacity:.42}
.pair-status{min-height:15px;margin-top:8px;color:#777773;font-size:9.5px;line-height:15px}
.pair-status.error{color:#ee6b70}

.connected{
  position:absolute;inset:0;animation:fadeIn .24s ease both;
}
.connection-status{
  position:absolute;left:0;right:0;top:136px;text-align:center;
  color:#d0d0cc;font-size:9px;line-height:12px;font-weight:650;
  letter-spacing:.24em;text-transform:uppercase;
}
.energy-star{
  position:absolute;
  z-index:5;
  left:calc(29px + (100% - 58px) * .424);
  top:45px;
  width:48px;height:44px;
  transform:translateX(-50%);
  pointer-events:none;
}
.energy-star img{
  display:block;width:100%;height:100%;object-fit:fill;
  image-rendering:auto;
  animation:starEnergy 2.35s ease-in-out infinite;
}
@keyframes starEnergy{
  0%,100%{transform:scale(.985);opacity:.94;filter:brightness(.98)}
  48%{transform:scale(1.015);opacity:1;filter:brightness(1.08)}
}

.metrics{
  position:absolute;left:33px;right:33px;top:191px;
  display:grid;grid-template-columns:repeat(3,1fr);align-items:start;
}
.metric{position:relative;text-align:center;min-width:0}
.metric + .metric::before{
  content:"";position:absolute;left:0;top:3px;width:1px;height:37px;background:#292927;
}
.metric-label{
  display:block;color:#8f8f8b;font-size:8.5px;line-height:11px;font-weight:650;
  letter-spacing:.12em;text-transform:uppercase;
}
.metric-value{
  display:block;margin-top:5px;color:#f6f6f3;font-size:15px;line-height:18px;font-weight:760;
  letter-spacing:-.025em;white-space:nowrap;
}

.version{
  position:absolute;left:0;right:0;bottom:9px;text-align:center;
  color:#4d4d49;font-size:8px;line-height:10px;font-weight:520;letter-spacing:.02em;
}

.settings{
  position:absolute;inset:0;z-index:40;background:#050505;padding:19px 22px 22px;overflow:auto;
  transform:translateX(102%);transition:transform .2s cubic-bezier(.2,.8,.2,1);
}
.settings.show{transform:none}
.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:21px}
.settings-head h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.02em}
.close{width:30px;height:30px;border:0;border-radius:9px;background:#111;color:#999;cursor:pointer;font-size:19px;line-height:1}
.close:hover{color:#fff}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #151515}
.setting-copy strong{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600}
.setting-copy span{display:block;color:#676767;font-size:9.5px;margin-top:3px;line-height:14px}
.experimental{font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:#888;border:1px solid #292929;border-radius:999px;padding:2px 5px}
.switch{width:32px;height:18px;border-radius:999px;background:#242424;padding:2px;cursor:pointer;transition:.15s;flex:none}
.switch i{display:block;width:14px;height:14px;background:#aaa;border-radius:50%;transition:.15s}
.switch.on{background:#fff}
.switch.on i{background:#000;transform:translateX(14px)}
.field{margin-top:17px}
.field label{display:block;color:#666;font-size:9.5px;font-weight:600;margin-bottom:7px}
.field input{width:100%;height:38px;border:1px solid #202020;border-radius:10px;padding:0 11px;background:#0b0b0b;color:#d8d8d8;outline:none;font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.danger{width:100%;height:40px;margin-top:20px;border:1px solid #31191a;background:#130909;color:#e36a6e;border-radius:11px;cursor:pointer;font-weight:650;font-size:10.5px}
.danger:hover{background:#1b0d0e}
.settings .version{position:static;margin-top:17px}

@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
let config={server:'http://localhost:3874',token:'',installId:''};
let plugin={}; let running=false; let clientId=''; let pairing=false; let probeTimer=null; let reconnectFailures=0;
let settings={writeEnabled:true,unsafeInvokeEnabled:false,eventsEnabled:true,maxReads:4};
let stats={commands:0,errors:0,lastLatency:null};
const AI_PROMPT='Connect to my open Figma file through figma-agent-bridge. If figma-agent-bridge is not yet configured or running in your MCP servers, reply with "Understood.", automatically register it in your MCP configuration (pointing to bridge/server.mjs), concisely explain what you configured and that I must restart/reload the agent environment, and tell me to say "continue" once restarted so you can provide the 6-digit pairing code. If already connected, call bridge_status and provide the 6-digit pairing code.';

function randomId(prefix='id'){const a=crypto.getRandomValues(new Uint32Array(4));return prefix+'-'+[...a].map(x=>x.toString(16)).join('')}
function ensureIds(){if(!config.installId)config.installId=randomId('install');clientId=config.installId+'-'+randomId('run').slice(-20)}
function post(msg){parent.postMessage({pluginMessage:msg},'*')}
function save(){post({type:'save-config',config})}
function pushSettings(){post({type:'bridge-settings',...settings})}
async function api(path,options={}){const url=config.server.replace(/\/$/,'')+path;return fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}})}
function authBody(extra={}){return {token:config.token,clientId,installId:config.installId,...extra}}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function showSetup(){$('setupView').classList.remove('hide');$('connectedView').classList.add('hide')}
function showConnected(){$('setupView').classList.add('hide');$('connectedView').classList.remove('hide');updateStats()}
function setPairStatus(text,error=false){const el=$('pairStatus');el.textContent=text||'';el.classList.toggle('error',!!error)}
function updateStats(){
  $('commands').textContent=String(stats.commands);
  $('errors').textContent=String(stats.errors);
  $('latency').textContent=stats.lastLatency==null?'–':Math.round(stats.lastLatency)+'ms';
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text)}catch(_){
    const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
  }
}
function revealStepTwo(){
  const step=$('stepTwo');
  if(!step.classList.contains('revealed')){
    step.classList.add('revealed');
    step.setAttribute('aria-hidden','false');
    setTimeout(()=>{if(!pairing)otpInputs[0].focus()},190);
  }
}
$('copyPrompt').onclick=async()=>{
  await copyText(AI_PROMPT);
  revealStepTwo();
  const preview=$('promptPreview'), old=preview.textContent;
  preview.textContent='Copied to clipboard';
  setTimeout(()=>{preview.textContent=old},1100);
};

const otpInputs=[...$('otp').querySelectorAll('input')];
function otpValue(){return otpInputs.map(i=>i.value).join('')}
function otpFill(digits, startIdx=0){
  if(pairing)return;
  const clean=String(digits||'').replace(/\D/g,'');
  if(!clean)return;
  let targetChars;
  if(clean.length>=6){
    targetChars=clean.slice(0,6).split('');
  } else {
    targetChars=[...otpValue().split('')];
    for(let i=0;i<clean.length && (startIdx+i)<6;i++){
      targetChars[startIdx+i]=clean[i];
    }
  }
  otpInputs.forEach((inp,i)=>{
    inp.value=targetChars[i]||'';
    inp.classList.toggle('filled',!!inp.value);
  });
  setPairStatus('');
  const next=otpInputs.findIndex(i=>!i.value);
  (next===-1?otpInputs[5]:otpInputs[next]).focus();
  if(otpValue().length===6)submitPair();
}
function otpClear(){
  for(const i of otpInputs){i.value='';i.classList.remove('filled');i.disabled=false}
  if(!pairing)otpInputs[0].blur();
}
function handlePasteEvent(e, idx=0){
  if(pairing)return;
  e.preventDefault();
  const text=(e.clipboardData||window.clipboardData)?.getData('text')||'';
  const digits=text.replace(/\D/g,'');
  if(digits) otpFill(digits, idx);
}
otpInputs.forEach((inp,idx)=>{
  inp.oninput=()=>{
    if(pairing)return;
    const digits=inp.value.replace(/\D/g,'');
    if(digits.length>1){
      otpFill(digits, idx);
      return;
    }
    inp.value=digits.slice(0,1);
    inp.classList.toggle('filled',!!inp.value);
    setPairStatus('');
    if(inp.value&&idx<5)otpInputs[idx+1].focus();
    if(otpValue().length===6)submitPair();
  };
  inp.onkeydown=e=>{
    if(pairing)return;
    if(e.key==='Enter'&&otpValue().length===6){
      submitPair();
      return;
    }
    if(e.key==='Backspace'&&!inp.value&&idx>0){otpInputs[idx-1].focus();otpInputs[idx-1].value='';otpInputs[idx-1].classList.remove('filled')}
    if(e.key==='ArrowLeft'&&idx>0)otpInputs[idx-1].focus();
    if(e.key==='ArrowRight'&&idx<5)otpInputs[idx+1].focus();
  };
  inp.onpaste=e=>handlePasteEvent(e, idx);
  inp.onfocus=()=>inp.select();
});
$('otp').onpaste=e=>handlePasteEvent(e, 0);

async function probe(){
  config.server=$('server').value.trim()||'http://localhost:3874';
  try{const r=await fetch(config.server.replace(/\/$/,'')+'/health',{method:'GET'});return !!r.ok}catch(_){return false}
}
function stopProbeLoop(){if(probeTimer)clearTimeout(probeTimer);probeTimer=null}
function startProbeLoop(){
  stopProbeLoop();
  probeTimer=setTimeout(async()=>{
    if(await probe()){
      stopProbeLoop();
      if(config.token){try{await connect();return}catch(_){}}
      setPairStatus(otpValue().length===6?'Connecting…':'Ready for code');
      if(otpValue().length===6&&!pairing){
        submitPair();
      }
    }else{
      setPairStatus('Bridge offline — waiting for MCP server…', true);
    }
    if(!running)startProbeLoop();
  },1000);
}
async function boot(){
  stopProbeLoop();ensureIds();showSetup();setPairStatus('');
  const up=await probe();
  if(!up){running=false;setPairStatus('Bridge offline — waiting for MCP server…', true);startProbeLoop();return}
  if(config.token){try{await connect();return}catch(_){/* stale token: stay on setup */}}
  running=false;setPairStatus('Ready for code');
}
async function submitPair(){
  const code=otpValue(); if(code.length!==6||pairing)return;
  pairing=true;setPairStatus('Connecting…');for(const i of otpInputs)i.disabled=true;
  try{
    ensureIds();
    const r=await api('/pair',{method:'POST',body:JSON.stringify({code,clientId,installId:config.installId,plugin})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'Pairing failed');
    config.token=j.token;save();await connect();
  }catch(e){
    pairing=false;for(const i of otpInputs)i.disabled=false;
    const isNetwork = e.name === 'TypeError' || /fetch|network|connect|offline/i.test(e.message||'');
    const msg = isNetwork ? 'Bridge offline — waiting for MCP server…' : (e.error || e.message || String(e));
    setPairStatus(msg, true);
    if(isNetwork){
      startProbeLoop();
    }else{
      otpClear();
      otpInputs[0].focus();
    }
  }
}
async function connect(){
  config.server=$('server').value.trim()||'http://localhost:3874';ensureIds();
  if(!config.token)throw new Error('Not paired');
  const r=await api('/hello',{method:'POST',body:JSON.stringify(authBody({plugin}))});const j=await r.json();
  if(!r.ok)throw new Error(j.error||'Authentication failed');
  pairing=false;running=true;reconnectFailures=0;setPairStatus('');showConnected();pushSettings();pollLoop();
}
async function pollLoop(){
  while(running){
    try{
      const q=new URLSearchParams({token:config.token,clientId,installId:config.installId,max:'8'});
      const r=await api('/poll?'+q.toString(),{method:'GET',headers:{}});
      if(r.status===204){reconnectFailures=0;continue}
      if(!r.ok)throw new Error((await r.text())||`HTTP ${r.status}`);
      reconnectFailures=0;
      const body=await r.json();const commands=Array.isArray(body.commands)?body.commands:(body.id?[body]:[]);
      for(const command of commands){stats.commands++;updateStats();post({type:'bridge-command',command})}
    }catch(_){
      if(!running)break;
      reconnectFailures++;await sleep(700);
      try{const r=await api('/hello',{method:'POST',body:JSON.stringify(authBody({plugin}))});if(r.ok){reconnectFailures=0}}catch(_e){}
      if(reconnectFailures>=4){running=false;showSetup();setPairStatus('Bridge offline',true);startProbeLoop();break}
    }
  }
}
async function sendResult(msg){
  if(msg.timingMs!=null)stats.lastLatency=Number(msg.timingMs);
  if(!msg.ok)stats.errors++;
  updateStats();
  try{const r=await api('/result',{method:'POST',body:JSON.stringify(authBody(msg))});if(!r.ok)throw new Error(await r.text())}
  catch(_){stats.errors++;updateStats()}
}
async function sendEvent(msg){if(!running||!config.token||!settings.eventsEnabled)return;try{await api('/event',{method:'POST',body:JSON.stringify(authBody({event:msg.event,payload:msg.payload}))})}catch(_){}}

function showSettings(on){$('sheet').classList.toggle('show',!!on);$('sheet').setAttribute('aria-hidden',on?'false':'true')}
$('gear').onclick=()=>showSettings(true);$('closeSettings').onclick=()=>showSettings(false);
function toggle(id,key){$ (id).onclick=()=>{settings[key]=!settings[key];$(id).classList.toggle('on',settings[key]);pushSettings()}}
toggle('writeSwitch','writeEnabled');toggle('unsafeSwitch','unsafeInvokeEnabled');toggle('eventsSwitch','eventsEnabled');
$('server').onchange=()=>{config.server=$('server').value.trim()||'http://localhost:3874';save();if(!running)boot()};
$('disconnect').onclick=async()=>{
  running=false;stopProbeLoop();try{await api('/shutdown',{method:'POST',body:JSON.stringify(authBody())})}catch(_){}
  config.token='';save();stats={commands:0,errors:0,lastLatency:null};updateStats();
  showSettings(false);showSetup();setPairStatus('');otpClear();
  $('stepTwo').classList.remove('revealed');$('stepTwo').setAttribute('aria-hidden','true');
  startProbeLoop();
};

window.onmessage=event=>{
  const msg=event.data&&event.data.pluginMessage;if(!msg)return;
  if(msg.type==='plugin-init'){
    plugin=msg.plugin||{};config={...config,...(msg.config||{})};ensureIds();
    $('server').value=config.server||'http://localhost:3874';save();pushSettings();boot();
  }
  else if(msg.type==='bridge-result')sendResult(msg);
  else if(msg.type==='figma-event')sendEvent(msg);
};
post({type:'ui-ready'});
</script>
</body>
</html>
